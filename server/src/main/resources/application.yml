server:
  port: ${SERVER_PORT:3101}
  tomcat:
    # 双轨取证用：访问日志是"这条请求真的落在 Java 上"的唯一硬证据（页面级切流的验证依赖它）。
    # 注意 accesslog.directory 的相对路径是相对 Tomcat 的 base 目录解析的，
    # 不设 basedir 时 base 目录是系统临时目录，日志会莫名找不到——这里显式钉在项目内。
    basedir: .
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      pattern: '%t "%m %U%q" %s %b %Dms %a'

spring:
  application:
    name: inkstack-server
  config:
    # 本地开发凭据（由 scripts/gen-java-env.mjs 从根目录 .env 派生，不入库）
    import: optional:file:./config/application-local.properties
  # Spring AI 的 starter 会给**每种**模型都装一个 Bean，而只要没配 api-key 整个上下文就起不来
  # （实测：连 OpenAiAudioSpeechAutoConfiguration 都能以 "OpenAI API key must be set" 炸掉启动）。
  # 所以全部关掉自动装配，由 AvatarEngine 按"开关 + 有没有 Key"自己构造 ChatModel——
  # 没配 Key 的部署照样起得来，并照旧落模板兜底。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    url: ${INKSTACK_DB_URL}
    username: ${INKSTACK_DB_USER}
    password: ${INKSTACK_DB_PASSWORD}
    hikari:
      pool-name: inkstack-pool
      maximum-pool-size: ${INKSTACK_DB_POOL_MAX:10}
      minimum-idle: 2
      # 与 Node 侧 mysql2 全局池一致：不在连接上改写会话时区，
      # 否则 NOW() / FROM_UNIXTIME() 在两栈之间会偏移，双轨对拍失真。
      connection-timeout: 8000
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 故意放宽到业务上限（5MB）之上：真拒由控制器判，才能回出与 Node 一字不差的
      # {"error":"图片不能超过 5MB"} + 413。让 Tomcat 先拦下，客户端收到的就是 Spring 的
      # MaxUploadSizeExceededException 页面——换栈期这就是"接口看起来一样其实不一样"。
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    banner: false

# 与 Node 侧 lib/auth.ts 共用的密钥：必须是同一个值，否则会话互不认。
inkstack:
  session-secret: ${SESSION_SECRET}
  site-url: ${NEXT_PUBLIC_SITE_URL:}
  # 图片上传落盘目录。双轨期文件由 Next 从 public/uploads 直接伺服，而 Java 进程的工作目录
  # 是 server/，所以这里必须是**指向同一个目录的显式路径**（gen-java-env 写绝对路径）。
  # 配错的表现为"上传成功、URL 回来了、图片 404"，两侧各测各的都发现不了。
  upload-dir: ${INKSTACK_UPLOAD_DIR:public/uploads}
  # RSS 抓取的私网校验总闸：与 Node 的 IMPORT_ALLOW_PRIVATE 同义，只给本机调试与第十三道闸门用。
  # 关掉它就没法在本机跑通任何一次抓取（本机订阅源夹具必然落在环回上），所以两侧都必须认这个值。
  import:
    allow-private: ${IMPORT_ALLOW_PRIVATE:0}
  # AI 分身：这两个值共同决定 GET /api/agent/status 报的是哪一档（agentscope / live / demo）。
  # Node 读的是 process.env，Java 进程不继承 .env，所以必须由 gen-java-env 派生同一个值——
  # 否则同一份配置下徽标一边亮一边灭，"没配 Key 就绝不真调大模型"这条前提也只有一侧成立。
  agent:
    service-url: ${AGENT_SERVICE_URL:}
    deepseek-key: ${DEEPSEEK_API_KEY:}
    # live 通道的 DeepSeek 接入点。默认官方地址，留口子是为了让闸门拿本地 SSE 夹具
    # 验"上游坏态不扣墨"——不留就只能对着真大模型测，每验一次真花一次 token。
    deepseek-base: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # 智能体引擎：off=沿用三条通道（默认，双轨对拍要求两侧同行为）；
    # spring-ai=用 Java 侧的 Spring AI 智能体顶掉 Python 的 agent-service。
    # ⚠ 这是**只存在于 Java 侧的第四通道**：开了它就必须把 /api/ai 与 /api/agent 整前缀切给 Java，
    # 否则同一个 URL 在 Node 那侧没有引擎，两栈行为分叉——它是"目标态"，不是"双轨期"的开关。
    engine: ${AGENT_ENGINE:off}
    model:
      # OpenAI 兼容协议：DeepSeek 官方就是 https://api.deepseek.com/v1，换百炼只改这三行。
      base-url: ${AGENT_MODEL_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${AGENT_MODEL_API_KEY:${DEEPSEEK_API_KEY:}}
      name: ${AGENT_MODEL_NAME:deepseek-chat}
  trust-proxy: ${TRUST_PROXY:0}
  # devCode 回显的门禁：Node 侧读的是 process.env.NODE_ENV，这里由 gen-java-env.mjs 派生同一个值，
  # 否则同一份 .env 起两栈会出现"一侧回显验证码、另一侧不回显"这种对拍假象。
  node-env: ${NODE_ENV:development}
  # 邮件通道：三项齐全才真发，缺任一项即 dev 降级（打印 + 回显 devCode），与 lib/mailer.ts 同判据
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    user: ${SMTP_USER:}
    pass: ${SMTP_PASS:}
    from: ${SMTP_FROM:}
  # 第三方登录：id+secret 齐全该家才亮灯（/api/auth/providers 的布尔值就是这个判据）
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    gitee:
      client-id: ${GITEE_CLIENT_ID:}
      client-secret: ${GITEE_CLIENT_SECRET:}
    qq:
      client-id: ${QQ_CLIENT_ID:}
      client-secret: ${QQ_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.inkstack: info
