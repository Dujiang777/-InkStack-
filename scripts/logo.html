<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: transparent; }
  /* 墨栈 Gitee OAuth 应用 Logo：与站内墨印同款 */
  #logo {
    width: 512px; height: 512px;
    background: linear-gradient(160deg, #c14a3a 0%, #a52a22 55%, #8f201b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
    font-weight: 700;
  }
  #logo::before {
    content: "";
    position: absolute; inset: 26px;
    border: 6px solid rgba(255, 250, 240, 0.85);
    border-radius: 18px;
  }
  .zi {
    color: #fffaf0;
    font-size: 168px; line-height: 1.18;
    letter-spacing: 0;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
  }
  .seal {
    margin-top: 14px;
    color: rgba(255, 250, 240, 0.92);
    font-size: 30px; letter-spacing: 0.42em; text-indent: 0.42em;
    font-family: Georgia, "SimSun", serif;
  }
</style>
</head>
<body>
  <div id="logo">
    <div class="zi">墨栈</div>
    <div class="seal">INKSTACK</div>
  </div>
</body>
</html>
